<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test — Echo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 620px;
            padding: 24px;
            border: 1px solid #e2e8f0;
        }
        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background: #fee2e2;
            color: #991b1b;
            margin-bottom: 16px;
        }
        .status-badge.connected {
            background: #dcfce7;
            color: #166534;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        #messages {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
            height: 320px;
            overflow-y: auto;
            padding: 14px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .sent {
            background: #2563eb;
            color: #ffffff;
            align-self: flex-end;
        }
        .received {
            background: #e2e8f0;
            color: #1e293b;
            align-self: flex-start;
        }
        .system {
            background: transparent;
            color: #64748b;
            font-size: 12px;
            font-style: italic;
            align-self: center;
            text-align: center;
            padding: 2px;
        }
        .input-group {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #2563eb;
        }
        button {
            padding: 11px 18px;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-send {
            background: #2563eb;
            color: #ffffff;
        }
        .btn-send:hover {
            background: #1d4ed8;
        }
        .btn-toggle {
            background: #ef4444;
            color: #ffffff;
        }
        .btn-toggle:hover {
            background: #dc2626;
        }
        .btn-toggle.connect {
            background: #10b981;
        }
        .btn-toggle.connect:hover {
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔌 WebSocket Echo Test</h2>
        <div id="statusBadge" class="status-badge">
            <span class="dot"></span>
            <span id="statusText">Ulanmagan</span>
        </div>

        <div id="messages"></div>

        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Xabar yozing (masalan: Salom!)..." disabled />
            <button id="sendBtn" class="btn-send" onclick="sendMessage()" disabled>Yuborish</button>
            <button id="toggleBtn" class="btn-toggle connect" onclick="toggleConnection()">Ulanish</button>
        </div>
    </div>

    <script>
        let ws = null;
        const messagesDiv = document.getElementById("messages");
        const input = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");
        const toggleBtn = document.getElementById("toggleBtn");
        const statusBadge = document.getElementById("statusBadge");
        const statusText = document.getElementById("statusText");

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = `msg ${type}`;
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function setConnected(connected) {
            if (connected) {
                statusBadge.className = "status-badge connected";
                statusText.textContent = "Ulangan (ws://localhost:8000/ws)";
                toggleBtn.textContent = "Uzish";
                toggleBtn.className = "btn-toggle";
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            } else {
                statusBadge.className = "status-badge";
                statusText.textContent = "Ulanmagan";
                toggleBtn.textContent = "Ulanish";
                toggleBtn.className = "btn-toggle connect";
                input.disabled = true;
                sendBtn.disabled = true;
            }
        }

        function toggleConnection() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                ws.close();
            } else {
                connect();
            }
        }

        function connect() {
            try {
                ws = new WebSocket("ws://localhost:8000/ws");

                ws.onopen = () => {
                    setConnected(true);
                    addMessage("✅ Serverga ulandi!", "system");
                };

                ws.onmessage = (event) => {
                    addMessage("Server: " + event.data, "received");
                };

                ws.onclose = () => {
                    setConnected(false);
                    addMessage("❌ Ulanish yopildi", "system");
                };

                ws.onerror = (error) => {
                    addMessage("⚠️ Xatolik yuz berdi", "system");
                };
            } catch (err) {
                addMessage("Ulanish xatosi: " + err, "system");
            }
        }

        function sendMessage() {
            const message = input.value.trim();
            if (message && ws && ws.readyState === WebSocket.OPEN) {
                addMessage("Siz: " + message, "sent");
                ws.send(message);
                input.value = "";
            }
        }

        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        // Avtomatik ulanish
        connect();
    </script>
</body>
</html>
